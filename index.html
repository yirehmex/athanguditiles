<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Athangudi Tiles Manufacturer in Tamil Nadu | YirehMex</title>

<meta name="description" content="YirehMex Athangudi Tiles - Premium handmade tiles manufacturer in Tamil Nadu.">
<meta name="robots" content="index, follow">

<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100vh;
    font-family: Arial, sans-serif;
}

/* Loading screen */
#loader {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
}

#loader h2 {
    margin-top: 10px;
    font-weight: normal;
}

/* iframe */
iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>

<body>

<!-- Loading Screen -->
<div id="loader">
    <h1>YirehMex</h1>
    <h2>Loading...</h2>
</div>

<!-- Your App / Website -->
<iframe 
    id="contentFrame"
    src="https://app.emergent.sh/loading-preview?host=showcase-me-32.preview.emergentagent.com"
    allowfullscreen>
</iframe>

<script>
const iframe = document.getElementById('contentFrame');
const loader = document.getElementById('loader');

/* Show site after load */
iframe.onload = function() {
    loader.style.display = "none";
    iframe.style.display = "block";
};

/* Communication handling */
window.addEventListener('message', function(event) {

    if (event.data && event.data.type === 'reload') {
        window.location.reload();
    }

    if (event.data && event.data.type === 'url') {
        window.open(event.data.url, '_blank');
    }

});
</script>

</body>
</html>
